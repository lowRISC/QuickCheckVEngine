name: Haskell CI

on:
  push:
    branches: [ "master", "cheriot-rebase" ]
  pull_request:
    branches: [ "master", "cheriot-rebase" ]

permissions:
  contents: read

jobs:

  hlint:
    name: Run HLint on the QuickCheck Verification Engine codebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Set up HLint'
        uses: haskell-actions/hlint-setup@v2
      - name: 'Run HLint'
        uses: haskell-actions/hlint-run@v2

  build:
    name: Build the QuickCheck Verification Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8'
          cabal-version: '3.12'
      - name: Install dependencies
        run: |
          cabal update
          cabal build --only-dependencies --enable-tests all
      - name: Build
        run: cabal build --enable-tests all
      - name: Codec self-check
        run: cabal test --test-show-details=direct CodecCheck
